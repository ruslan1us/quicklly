# Temporary, for the port branch only: builds the macOS and Linux bundles once before the first
# release that has them, so DMG, AppImage, deb and rpm can be downloaded from the run and tried.
# Remove this file before the port is merged into main.
name: Bundle trial

on:
  push:
    branches: [port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-trial-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Bundle the macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned to a commit, the action no longer takes the toolchain from its ref.
          toolchain: stable
          # Both architectures, for the universal build.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Signed ad hoc as in a release, so the DMG can be tried on a Mac; the updater artifacts,
      # which need the signing key, are left out.
      - name: Build the bundles
        env:
          # As tauri-action does: lay out the DMG window with Finder even on CI.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: >-
          npm run tauri build -- --target universal-apple-darwin
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4 # TODO pin
        with:
          name: macos-bundles
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Bundle the Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same packages as the release workflow's Linux job.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned to a commit, the action no longer takes the toolchain from its ref.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # --no-sign skips the updater signatures, so no secrets are needed.
      - name: Build the bundles
        run: npm run tauri build -- --no-sign

      # The files lose their executable bit in the artifact: chmod +x the AppImage after download.
      - uses: actions/upload-artifact@v4 # TODO pin
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
