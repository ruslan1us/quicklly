name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build installers and draft a release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The tag must match the app version, otherwise installers get the wrong version in their names.
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag does not match the version in tauri.conf.json, package.json and Cargo.toml"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Builds the NSIS and MSI installers and attaches them to a draft release,
      # which is published by hand after a quick check.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quicklly ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
