<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/themes.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Quicklly</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <textarea
      id="note"
      rows="1"
      placeholder="Quick note…"
      autocomplete="off"
      spellcheck="false"
      autofocus
    ></textarea>
    <span class="hint">← notes · /config settings</span>
    <div id="caret" aria-hidden="true"></div>
    <div id="measure" class="mirror" aria-hidden="true"></div>
    <div id="caret-measure" class="mirror" aria-hidden="true"></div>
  </body>
</html>
